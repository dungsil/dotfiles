symbolPreset: nerd
composer:
  shape: band
theme:
  dark: titanium
setupVersion: 2
edit:
  mode: hashline
tools:
  approvalMode: yolo
  abortOnFabricatedResult: true
defaultThinkingLevel: auto
memory:
  backend: mnemopi
mnemopi:
  embeddingVariant: multilingual
autolearn:
  enabled: false
plan:
  defaultOnStartup: false
  enabled: true
task:
  enableLsp: true
  isolation:
    commits: ai
    enabled: true
  softRequestBudget: 200
  agentAdvisor:
    designer: tailscale/gemini-3.5-flash-lite:high
  agentModelOverrides:
    scout: "@scout"
    librarian: "@research"
    isolation:
      mode: auto
    agentAdvisor:
      task: "on"
  showResolvedModelBadge: true
  prewalk: false
statusLine:
  preset: full
  separator: powerline-thin
  transparent: false
display:
  showTokenUsage: true
  showTurnTime: true
  hideToolActivity: false
  cacheMissMarker: true
secrets:
  enabled: true
retry:
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    default:
      - tailscale/claude-opus-4-6:high
      - tailscale/gemini-3.8-flash:high
      - tailscale/glm-5.3:max
    smol:
      - tailscale/gemini-3.8-flash:high
      - tailscale/claude-opus-4-6:high
      - tailscale/gpt-6-luna:max
      - tailscale/deepseek-v4.1-flash:max
      - tailscale/glm-5.3-flash:max
    slow:
      - tailscale/claude-fable-5-1:max
      - tailscale/glm-5.3:max
      - tailscale/deepseek-v4.1-flash:max
    tiny:
      - tailscale/gemini-3.5-flash-lite:minimal
      - tailscale/glm-5.3-flash:low
      - tailscale/deepseek-v4.1-flash:low
    commit:
      - tailscale/gpt-6-luna:medium
      - tailscale/gemini-3.5-flash-lite:low
      - tailscale/glm-5.3-flash:low
    vision:
      - tailscale/gemini-3.5-flash-lite:xhigh
      - tailscale/gpt-6-astra:medium
    designer:
      - tailscale/claude-sonnet-5:high
      - tailscale/gemini-3.5-flash-lite:xhigh
      - tailscale/glm-5.3:max
    task:
      - tailscale/claude-sonnet-5:high
      - tailscale/gemini-3.8-flash:high
      - tailscale/glm-5.3:max
      - tailscale/deepseek-v4.1-flash:max
    advisor:
      - tailscale/gpt-6-luna:max
      - tailscale/gemini-3.8-flash:high
      - tailscale/deepseek-v4.1-flash:max
    plan:
      - tailscale/gpt-6-astra:high
      - tailscale/glm-5.3:max
      - tailscale/deepseek-v4.1-flash:max
    scout:
      - tailscale/gemini-3.8-flash:medium
      - tailscale/glm-5.3-flash:high
      - tailscale/claude-sonnet-5:low
    research:
      - tailscale/gemini-3.5-flash-lite:low
      - tailscale/gpt-6-luna:low
      - tailscale/glm-5.3-flash:low
    web:
      - web/parallel
      - web/perplexity
      - google/gemini-2.5-flash
      - google-antigravity/gemini-2.5-flash
      - anthropic/claude-haiku-4-5
      - openai-codex/gpt-5.6-luna
      - openai-codex/gpt-5.6
      - openai-codex/gpt-5.5
      - xai/grok-4.5
      - xai-oauth/grok-4.5
      - web/zai
      - web/exa
      - web/tinyfish
      - web/jina
      - web/tavily
      - web/firecrawl
      - web/brave
      - web/kimi
      - web/synthetic
      - web/ollama
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/public
  maxRetries: 1
modelRoleStorage: global
browser:
  headless: true
  relay: true
personality: default
providers:
  fetch: auto
  cacheRetention: auto
  webSearchTimeoutSeconds: 60
  autoThinkingMaxEffort: max
  anthropic:
    serverSideFallback: true
exa:
  enabled: true
compaction:
  asyncEnabled: true
  autoContinue: true
  keepRecentTokens: 20000
modelRoles:
  default: tailscale/gpt-6-astra:medium
  smol: tailscale/gemini-3.8-flash:high
  slow: tailscale/gpt-6-astra:high
  tiny: tailscale/deepseek-v4.1-flash:high
  commit: tailscale/deepseek-v4.1-flash
  vision: tailscale/gemini-3.8-flash:high
  designer: tailscale/gemini-3.8-flash:high
  task: tailscale/gpt-6-luna:max
  advisor: tailscale/claude-opus-4-6:high
  plan: tailscale/claude-fable-5-1:max
  scout: tailscale/gpt-6-luna:medium
  research: tailscale/gpt-6-luna:low
  web: web/kagi
cycleOrder:
  - default
  - smol
  - plan
advisor:
  enabled: false
  syncBacklog: "off"
  immuneTurns: 3
prewalk:
  enabled: false
model:
  loopGuard:
    enabled: true
features:
  unexpectedStopDetection: smart
github:
  enabled: true
astGrep:
  enabled: true
checkpoint:
  enabled: true
tui:
  hyperlinks: auto
  renderMermaid: true
  tight: false
lsp:
  formatOnWrite: true
  diagnosticsOnWrite: true
  diagnosticsOnEdit: false
git:
  enabled: true
commit:
  mapReduceEnabled: true
gc:
  blobs: true
  coldArchiveAfterDays: 30
steeringMode: one-at-a-time
doubleEscapeAction: rewind
autoResume: false
images:
  describeForTextModels: true
  autoResize: true
terminal:
  showImages: true
speech:
  enabled: false
  enhanced: false
python:
  kernelMode: session
power:
  sleepPrevention: idle
hideThinkingBlock: false
disabledExtensions:
  []
tier:
  openai: priority
bash:
  autoBackground:
    enabled: true
  patterns:
    - match: scoop install*
      approval: deny
    - match: scoop uninstall*
      approval: deny
    - match: scoop rm*
      approval: deny
    - match: winget install*
      approval: deny
    - match: winget.exe install*
      approval: deny
    - match: winget uninstall*
      approval: deny
    - match: winget.exe uninstall*
      approval: deny
    - match: git config set*
      approval: deny
dev:
  autoqaConsent: granted
isolation:
  backend: auto
enabledProviders:
  []
disabledProviders:
  []
