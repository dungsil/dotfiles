symbolPreset: nerd
composer:
  shape: band
theme:
  dark: titanium
setupVersion: 2
edit:
  mode: hashline
tools:
  approvalMode: yolo
  abortOnFabricatedResult: true
defaultThinkingLevel: auto
memory:
  backend: mnemopi
mnemopi:
  embeddingVariant: multilingual
autolearn:
  enabled: false
plan:
  defaultOnStartup: false
  enabled: true
task:
  enableLsp: true
  isolation:
    commits: ai
    enabled: true
  softRequestBudget: 200
  agentAdvisor:
    designer: tailscale/gemini-flash-lite:high
  agentModelOverrides:
    scout: "@scout"
    librarian: "@research"
    isolation:
      mode: auto
    agentAdvisor:
      task: "on"
  showResolvedModelBadge: true
statusLine:
  preset: full
  separator: powerline-thin
  transparent: false
display:
  showTokenUsage: true
  showTurnTime: true
  hideToolActivity: true
  cacheMissMarker: true
secrets:
  enabled: true
retry:
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    default:
      - tailscale/opus-4.6:max
      - tailscale/gemini-3.7-flash:high
      - tailscale/glm-5.3:max
    smol:
      - tailscale/glm-5.3-flash:max
      - tailscale/sonnet-5:medium
      - tailscale/deepseek-v4-flash:max
      - tailscale/gpt-5.6-luna:max
    slow:
      - tailscale/fable-5.1:max
      - tailscale/glm-5.3:max
      - tailscale/deepseek-v4-pro:max
    tiny:
      - tailscale/gemini-3.5-flash-lite:minimal
      - tailscale/haiku-4.5:minimal
      - tailscale/glm-5.3-flash:low
      - tailscale/deepseek-v4-flash:low
    commit:
      - tailscale/gpt-5.6-luna:medium
      - tailscale/gemini-3.5-flash-lite:low
      - tailscale/glm-5.3-flash:low
    vision:
      - tailscale/gemma-4-31b:xhigh
      - tailscale/gpt-6-astra:medium
    designer:
      - tailscale/sonnet-5:high
      - tailscale/gemma-4-31b:xhigh
      - tailscale/glm-5.3:max
    task:
      - tailscale/sonnet-5:high
      - tailscale/gemini-3.7-flash:high
      - tailscale/glm-5.3:max
      - tailscale/deepseek-v4-pro:max
    advisor:
      - tailscale/gpt-5.6-luna:max
      - tailscale/gemini-3.7-flash:high
      - tailscale/deepseek-v4-pro:max
    plan:
      - tailscale/gpt-6-astra:high
      - tailscale/glm-5.3:max
      - tailscale/deepseek-v4-pro:max
    scout:
      - tailscale/gemini-3.7-flash:medium
      - tailscale/glm-5.3-flash:high
      - tailscale/sonnet-5:low
    research:
      - tailscale/gemini-3.5-flash-lite:low
      - tailscale/haiku-4.5:low
      - tailscale/gpt-5.6-luna:low
      - tailscale/glm-5.3-flash:low
modelRoleStorage: global
browser:
  headless: true
  relay: true
personality: default
providers:
  fetch: auto
  cacheRetention: auto
  webSearchTimeoutSeconds: 60
  webSearchOrder:
    - kagi
  autoThinkingMaxEffort: max
  webSearchExclude:
    - mojeek
exa:
  enabled: true
compaction:
  asyncEnabled: true
  autoContinue: true
  keepRecentTokens: 20000
modelRoles:
  default: tailscale/gpt-6-astra:medium
  smol: tailscale/gemini-3.8-flash:high
  slow: tailscale/gpt-6-astra:high
  tiny: tailscale/gpt-5.3-codex-spark:low
  commit: tailscale/solar-pro4
  vision: tailscale/gemini-3.8-flash:high
  designer: tailscale/gemini-3.8-flash:high
  task: tailscale/gpt-5.6-terra:max
  advisor: tailscale/opus-4.6:high
  plan: tailscale/fable-5.1:max
  scout: tailscale/gpt-5.6-luna:medium
  research: tailscale/gpt-5.3-codex-spark:low
cycleOrder:
  - default
  - smol
  - plan
advisor:
  enabled: false
  syncBacklog: "off"
  immuneTurns: 3
prewalk:
  enabled: true
model:
  loopGuard:
    enabled: true
features:
  unexpectedStopDetection: smart
github:
  enabled: true
astGrep:
  enabled: true
checkpoint:
  enabled: true
tui:
  hyperlinks: auto
  renderMermaid: true
  tight: false
mcp:
  enableProjectConfig: true
  notifications: false
lsp:
  formatOnWrite: true
  diagnosticsOnWrite: true
  diagnosticsOnEdit: false
git:
  enabled: true
commit:
  mapReduceEnabled: true
gc:
  blobs: true
  coldArchiveAfterDays: 30
steeringMode: one-at-a-time
doubleEscapeAction: rewind
autoResume: false
images:
  describeForTextModels: true
  autoResize: true
terminal:
  showImages: true
speech:
  enabled: false
  enhanced: false
python:
  kernelMode: session
power:
  sleepPrevention: idle
hideThinkingBlock: true
disabledExtensions:
  []
tier:
  openai: priority
bash:
  autoBackground:
    enabled: true
  patterns:
    - match: scoop install*
      approval: deny
    - match: scoop uninstall*
      approval: deny
    - match: scoop rm*
      approval: deny
    - match: winget install*
      approval: deny
    - match: winget.exe install*
      approval: deny
    - match: winget uninstall*
      approval: deny
    - match: winget.exe uninstall*
      approval: deny
    - match: git config set*
      approval: deny
dev:
  autoqaConsent: granted
isolation:
  backend: auto
enabledProviders:
  []
disabledProviders:
  []
