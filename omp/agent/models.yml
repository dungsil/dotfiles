providers:
  tailscale:
    baseUrl: https://ai.gila-map.ts.net/v1
    api: openai-completions
    auth: none
    models:
      - id: gpt-6-astra
        name: GPT-6 Astra
        reasoning: true
        maxTokens: 128000
        contextWindow: 1050000
        api: openai-responses
        input: [text, image]
      - id: gpt-6-sol
        name: GPT-6 Sol
