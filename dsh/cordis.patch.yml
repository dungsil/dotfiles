- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      opencode-go:
        baseURL: https://ai.gila-map.ts.net/v1
        api: openai-responses
        models:
          - id: qwen3.8-flash
            name: Qwen3.8 Flash
            contextWindow: 1000000
            maxTokens: 131072
            input:
              - text
              - image
          - id: deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash
            contextWindow: 1000000
            maxTokens: 384000
            input:
              - text
              - image
            reasoningEfforts:
              "off":
              minimal: minimal
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: glm-5.3-flash
            name: GLM 5.3 Flash
            contextWindow: 1310720
            maxTokens: 131072
            input:
              - text
            reasoningEfforts:
              "off":
              low: low
              high: high
              max: max
        apiKeyEnv: OPENCODE_GO_API_KEY
      opencode-go-kimi:
        baseURL: https://ai.gila-map.ts.net/v1
        api: openai-completions
        models:
          - id: kimi-k3
            name: Kimi K3
            contextWindow: 1000000
            maxTokens: 262144
            input:
              - text
              - image
        apiKeyEnv: OPENCODE_GO_API_KEY
      openai:
        baseURL: https://ai.gila-map.ts.net/v1
        api: openai-responses
        models:
          - id: gpt-6.1-sol
            name: GPT-6.1 Sol
            contextWindow: 1050000
            maxTokens: 128000
            input:
              - text
              - image
            reasoningEfforts:
              "off":
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: gpt-6.1-terra
            name: GPT-6.1 Terra
          - id: gpt-6-astra
            name: GPT-6 Astra
            contextWindow: 1050000
            maxTokens: 128000
            input:
              - text
              - image
            reasoningEfforts:
              "off":
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: gpt-6-luna
            name: GPT-6 Luna
            contextWindow: 1050000
            maxTokens: 128000
            input:
              - text
              - image
            reasoningEfforts:
              "off":
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
        apiKeyEnv: OPENAI_API_KEY
      google:
        baseURL: https://ai.gila-map.ts.net/v1beta
        models:
          - id: gemini-4-argon
            name: Gemini 4 Argon
          - id: gemini-3.8-flash
            name: Gemini 3.8 Flash
        apiKeyEnv: GOOGLE_API_KEY
      anthropic:
        baseURL: https://ai.gila-map.ts.net/
        api: anthropic-messages
        models:
          - id: claude-fable-5-1
            name: Fable 5.1
            contextWindow: 1000000
            maxTokens: 128000
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
            compat:
              forceAdaptiveThinking: true
          - id: claude-opus-5-5
            name: Opus 5.5
            contextWindow: 1000000
            maxTokens: 128000
            input:
              - text
              - image
            reasoningEfforts:
              "off":
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
            compat:
              forceAdaptiveThinking: true
          - id: claude-sonnet-5-5
            name: Sonnet 5.5
            contextWindow: 1000000
            maxTokens: 128000
            input:
              - text
              - image
            reasoningEfforts:
              "off":
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
            compat:
              forceAdaptiveThinking: true
          - id: claude-haiku-5-5
            name: Claude Haiku 5.5
            contextWindow: 1000000
            maxTokens: 128000
            input:
              - text
              - image
        apiKeyEnv: ANTHROPIC_API_KEY
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: detailed
    performanceUsage: detailed
    collapseTiming: next-input
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    usage: detailed
    developerTools: true
    purpose: null
    process: standard
    completion: api-key
  disabled: true
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: opencode-go
    model: deepseek-v4.1-flash
    reasoningEffort: max
- id: ui-conversation
  name: "@deepseek-ai/dsh-client-ui-conversation"
  config:
    busyEnter: steer
- id: ui-cordis
  disabled: true
- id: cot-translation
  name: "@deepseek-ai/dsh-experimental-client-ui-cot-translation"
  config:
    provider: google
    targetLanguage: auto
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
- id: session-log-deepseek
  name: "@deepseek-ai/dsh-session-log-deepseek"
  config:
    enabled: false
- id: entry-customization
  disabled: true
- id: ui-schedule
  disabled: true
