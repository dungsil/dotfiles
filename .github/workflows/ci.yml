name: CI

on:
  pull_request:
  push:
    branches:
      - gibon

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: PowerShell 구문 검사
        shell: pwsh
        run: |
          $hasError = $false
          foreach ($file in Get-ChildItem -Recurse -Filter *.ps1) {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
              if ($parseErrors.Count -gt 0) {
                  Write-Host "::error file=$($file.FullName)::$($parseErrors[0].Message)"
                  $hasError = $true
              }
          }
          if ($hasError) { exit 1 }
