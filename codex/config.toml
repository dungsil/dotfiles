model = "gpt-6-astra"
model_reasoning_effort = "medium"
service_tier = "default"
approvals_reviewer = "user"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true

[features]
memories = true

[memories]
generate_memories = true
use_memories = true

[desktop]
followUpQueueMode = "steer"
show-context-window-usage = true
toys-confetti-enabled = true
external-agent-import-sync-enabled = false
sansFontSize = 15
codeFontSize = 14
open-link-in-target-preference = "external-browser"
open-local-url-in-target-preference = "in-app-browser"
browser-show-full-url = false
git-pull-request-merge-method = "squash"
worktree-upstream-refresh-mode = "best-effort"
conversationDetailMode = "STEPS_COMMANDS"

[windows]
sandbox = "elevated"

[features.context_management]
experimental_mode = true

[mcp_servers.aperture]
url = "https://ai.gila-map.ts.net/v1/mcp"

[model_providers.tailscale]
name = "Tailscale AI Gateway"
base_url = "https://ai.gila-map.ts.net/v1"
wire_api = "responses"
requires_openai_auth = false
